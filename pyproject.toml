[project]
name = "text-to-sql-bot"
version = "0.1.0"
description = "Agentic Text-to-SQL bot with self-correcting query generation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["llm: calls real LLM providers (uses API quota); run with -m llm"]
addopts = "-m 'not llm'"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*ReadOnly.*:UserWarning"]
